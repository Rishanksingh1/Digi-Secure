<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Digi Secure</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-intro">
            <div class="brand-mark" aria-label="Digi Secure logo">DS</div>
            <p class="eyebrow">DIGI SECURE</p>
            <h1>One secure place<br><span>for what matters.</span></h1>
            <p class="intro-copy">Keep your essential documents close, private, and ready whenever you need them.</p>
            <div class="trust-note"><span class="status-dot"></span> Built for privacy</div>
        </section>
        <section class="auth-container" aria-labelledby="signup-title">
            <div class="form-heading">
                <p class="eyebrow">Get started</p>
                <h2 id="signup-title">Create your account</h2>
                <p class="subtitle">Set up your secure document workspace. We will email you a verification link.</p>
            </div>
        <p class="alert alert-error" th:if="${error}" th:text="${error}"></p>
        <form method="post" th:action="@{/signup}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label>Full name</label>
                <input type="text" name="name" placeholder="Enter your name" required/>
            </div>
            <div class="form-group">
                <label>Email address</label>
                <input type="email" name="email" placeholder="you@example.com" required/>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Create a password" required/>
            </div>
            <button type="submit" class="btn-primary">Create account</button>
        </form>
        <p class="switch-link">Already have an account? <a th:href="@{/login}">Log in</a></p>
        </section>
    </main>
</body>
</html>
