<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set up MFA - Digi Secure</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
    <main class="auth-container mfa-container">
        <div class="brand-mark shared-mark" aria-label="Digi Secure logo">DS</div>
        <p class="eyebrow">Account security</p>
        <h2>Set up Microsoft Authenticator</h2>
        <p class="subtitle">Scan this QR code in Microsoft Authenticator, then enter the six-digit code it generates.</p>
        <p class="alert alert-success" th:if="${mfaEnabled}">Multi-factor authentication is already enabled.</p>
        <img class="mfa-qr" th:src="${qrCode}" alt="Microsoft Authenticator setup QR code"/>
        <p class="mfa-manual">Can't scan? Enter this key manually:<br><strong th:text="${secret}">SECRET</strong></p>
        <p class="alert alert-error" th:if="${error}" th:text="${error}"></p>
        <form method="post" th:action="@{/mfa/setup}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="code">Authenticator code</label>
                <input id="code" type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required/>
            </div>
            <button class="btn-primary" type="submit">Enable MFA</button>
        </form>
        <p class="switch-link"><a th:href="@{/dashboard}">Return to dashboard</a></p>
    </main>
</body>
</html>
