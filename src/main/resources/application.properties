spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/secure_digital_locker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
app.public-base-url=${APP_PUBLIC_BASE_URL:}
logging.level.org.springframework.security=INFO

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

app.storage.location=storage/encrypted
app.encryption.master-key=${DOCUMENT_ENCRYPTION_MASTER_KEY}
app.encryption.legacy-secret=${LEGACY_DOCUMENT_ENCRYPTION_SECRET:}
app.ocr.tesseract-command=${TESSERACT_COMMAND:C:/Program Files/Tesseract-OCR/tesseract.exe}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${SMTP_FROM:no-reply@digi-secure.local}
app.share.alert-view-threshold=${SHARE_ALERT_VIEW_THRESHOLD:5}
